name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release
  CMAKE_OPTIONS: -DHYPERCACHE_BUILD_SERVER=ON -DHYPERCACHE_BUILD_REDIS=ON -DHYPERCACHE_BUILD_TESTS=ON -DHYPERCACHE_BUILD_BENCHMARKS=ON

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libssl-dev \
            redis-server

      - name: Start Redis
        run: |
          sudo systemctl start redis-server
          redis-cli ping

      - name: Configure CMake
        run: cmake -B build ${{ env.CMAKE_OPTIONS }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(nproc)

      - name: Run unit tests
        run: |
          cd build
          ctest --output-on-failure -j$(nproc)

      - name: Test server startup (LRU)
        run: |
          timeout 10 ./build/hypercache_server --cache lru --port 18081 &
          sleep 2
          curl -f http://localhost:18081/health
          curl -f -X PUT http://localhost:18081/cache/test -d "value"
          curl -f http://localhost:18081/cache/test
          curl -f http://localhost:18081/cache
          curl -f http://localhost:18081/telemetry

      - name: Test server startup (Redis)
        run: |
          timeout 10 ./build/hypercache_server --cache redis --redis-host 127.0.0.1 --redis-port 6379 --port 18082 &
          sleep 3
          curl -f http://localhost:18082/health
          curl -f -X PUT http://localhost:18082/cache/test -d "value"
          curl -f http://localhost:18082/cache/test
          curl -f http://localhost:18082/cache

      - name: Test similarity endpoint
        run: |
          curl -f -X POST http://localhost:18081/similarity \
            -H "Content-Type: application/json" \
            -d '{"lhs":[1.0,0.0],"rhs":[1.0,0.0]}'

  build-asan:
    runs-on: ubuntu-latest
    name: AddressSanitizer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libssl-dev \
            redis-server

      - name: Start Redis
        run: |
          sudo systemctl start redis-server
          redis-cli ping

      - name: Configure CMake (ASan)
        run: |
          cmake -B build-asan \
            -DHYPERCACHE_BUILD_SERVER=ON \
            -DHYPERCACHE_BUILD_REDIS=ON \
            -DHYPERCACHE_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -O1 -g" \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -O1 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address"

      - name: Build (ASan)
        run: cmake --build build-asan --config Debug -j$(nproc)

      - name: Run tests (ASan)
        run: |
          cd build-asan
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 ctest --output-on-failure -j$(nproc)

      - name: Run server (ASan)
        run: |
          timeout 10 ./build-asan/hypercache_server --cache lru --port 18081 &
          sleep 2
          curl -f http://localhost:18081/health
          curl -f -X PUT http://localhost:18081/cache/test -d "value"
          curl -f http://localhost:18081/cache/test

  build-valgrind:
    runs-on: ubuntu-latest
    name: Valgrind Memcheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libssl-dev \
            redis-server \
            valgrind

      - name: Start Redis
        run: |
          sudo systemctl start redis-server
          redis-cli ping

      - name: Configure CMake (Valgrind)
        run: |
          cmake -B build-valgrind \
            -DHYPERCACHE_BUILD_SERVER=ON \
            -DHYPERCACHE_BUILD_REDIS=ON \
            -DHYPERCACHE_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-O0 -g" \
            -DCMAKE_C_FLAGS="-O0 -g"

      - name: Build (Valgrind)
        run: cmake --build build-valgrind --config Debug -j$(nproc)

      - name: Run unit tests (Valgrind)
        run: |
          cd build-valgrind
          valgrind --tool=memcheck --leak-check=full --error-exitcode=1 --suppressions=../.github/valgrind.supp \
            ./hypercache_tests 2>&1 | tail -50

      - name: Run server (Valgrind)
        run: |
          valgrind --tool=memcheck --leak-check=full --error-exitcode=1 --suppressions=.github/valgrind.supp \
            timeout 10 ./build-valgrind/hypercache_server --cache lru --port 18081 &
          sleep 3
          curl -f http://localhost:18081/health
          curl -f -X PUT http://localhost:18081/cache/test -d "value"
          curl -f http://localhost:18081/cache/test

  build-tsan:
    runs-on: ubuntu-latest
    name: ThreadSanitizer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libssl-dev \
            redis-server

      - name: Start Redis
        run: |
          sudo systemctl start redis-server
          redis-cli ping

      - name: Configure CMake (TSan)
        run: |
          cmake -B build-tsan \
            -DHYPERCACHE_BUILD_SERVER=ON \
            -DHYPERCACHE_BUILD_REDIS=ON \
            -DHYPERCACHE_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -O1 -g" \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -O1 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"

      - name: Build (TSan)
        run: cmake --build build-tsan --config Debug -j$(nproc)

      - name: Run concurrent tests (TSan)
        run: |
          cd build-tsan
          TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1 ctest --output-on-failure -R "Concurrent" -j$(nproc)

      - name: Run stress tests (TSan)
        run: |
          cd build-tsan
          TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1 ctest --output-on-failure -R "Stress" -j$(nproc)

  build-benchmarks:
    runs-on: ubuntu-latest
    name: Benchmarks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libssl-dev \
            redis-server

      - name: Start Redis
        run: |
          sudo systemctl start redis-server
          redis-cli ping

      - name: Configure CMake
        run: cmake -B build ${{ env.CMAKE_OPTIONS }}

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Run benchmarks
        run: |
          cd build
          ./hypercache_benchmarks --benchmark_format=json --benchmark_out=benchmark_results.json --benchmark_out_format=json 2>&1 | tail -100

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: build/benchmark_results.json
          retention-days: 30

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install redis-64 -y

- name: Start Redis
        run: |
          sudo systemctl start redis-server
          redis-cli ping

      - name: Configure CMake
        run: cmake -B build ${{ env.CMAKE_OPTIONS }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j

      - name: Run unit tests
        run: |
          cd build
          ctest --output-on-failure -j -C ${{ env.BUILD_TYPE }}

  docker:
    runs-on: ubuntu-latest
    needs: [build-and-test, build-asan, build-valgrind, build-tsan, build-benchmarks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: hypercache-llm:${{ github.sha }}
          load: true

      - name: Test Docker image (LRU)
        run: |
          docker run -d --name hypercache-lru -p 18083:18080 hypercache-llm:${{ github.sha }}
          sleep 3
          curl -f http://localhost:18083/health
          docker stop hypercache-lru
          docker rm hypercache-lru

      - name: Test Docker image (Redis)
        run: |
          docker network create test-net
          docker run -d --name redis-test --network test-net redis:7-alpine
          docker run -d --name hypercache-redis --network test-net \
            -e CACHE_TYPE=redis -e REDIS_HOST=redis-test \
            -p 18084:18080 hypercache-llm:${{ github.sha }}
          sleep 5
          curl -f http://localhost:18084/health
          docker stop hypercache-redis redis-test
          docker rm hypercache-redis redis-test
          docker network rm test-net